{% extends "base.html" %}
{% block titulo %}{{ 'Editar serviço' if servico else 'Novo serviço' }} — VetCare{% endblock %}

{% block conteudo %}
<div class="titulo-pagina">
  <div><h1>{{ 'Editar serviço' if servico else 'Novo serviço' }}</h1></div>
</div>

<section class="bloco"><div class="bloco-corpo">
<form method="post">
  <div class="campo">
    <label for="nome">Nome do serviço</label>
    <input type="text" id="nome" name="nome" required value="{{ servico.nome if servico else '' }}">
  </div>
  <div class="campo">
    <label for="descricao">Descrição</label>
    <input type="text" id="descricao" name="descricao" value="{{ servico.descricao or '' if servico else '' }}">
  </div>
  <div class="campo" style="max-width:200px">
    <label for="preco">Preço (R$)</label>
    <input type="text" id="preco" name="preco" required value="{{ servico.preco if servico else '' }}">
  </div>
  <div class="campo marcador">
    <input type="checkbox" id="ativo" name="ativo" {{ 'checked' if (servico is none or servico.ativo) }}>
    <label for="ativo" style="margin:0">Serviço disponível</label>
  </div>
  <div class="acoes">
    <button class="botao" type="submit">Salvar serviço</button>
    <a class="botao neutro" href="{{ url_for('financeiro.servicos') }}">Cancelar</a>
  </div>
</form>
</div></section>
{% endblock %}
