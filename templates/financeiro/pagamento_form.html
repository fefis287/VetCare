{% extends "base.html" %}
{% block titulo %}Novo lançamento — VetCare{% endblock %}

{% block conteudo %}
<div class="titulo-pagina">
  <div><h1>Novo lançamento</h1><p>Em branco, o valor vem da tabela de serviços.</p></div>
</div>

<section class="bloco"><div class="bloco-corpo">
<form method="post">
  <div class="campo">
    <label for="agendamento_id">Consulta</label>
    <select id="agendamento_id" name="agendamento_id" required>
      <option value="">Selecione</option>
      {% for ag in agendamentos %}
        <option value="{{ ag.id }}" {{ 'selected' if agendamento_sugerido == ag.id }}>
          {{ ag.data_hora | datahora }} — {{ ag.animal.nome }} ({{ ag.animal.tutor.nome }})
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="linha">
    <div class="campo">
      <label for="servico_id">Serviço</label>
      <select id="servico_id" name="servico_id" required>
        <option value="">Selecione</option>
        {% for s in servicos %}
          <option value="{{ s.id }}">{{ s.nome }} — {{ s.preco | dinheiro }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="valor">Valor cobrado</label>
      <input type="text" id="valor" name="valor" placeholder="Usar o preço do serviço">
    </div>
  </div>

  <div class="linha">
    <div class="campo">
      <label for="forma_pagamento">Forma de pagamento</label>
      <select id="forma_pagamento" name="forma_pagamento">
        <option value="">Não definida</option>
        {% for f in formas %}<option value="{{ f }}">{{ f }}</option>{% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="status">Situação</label>
      <select id="status" name="status">
        {% for s in situacoes %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="data_vencimento">Vencimento</label>
      <input type="date" id="data_vencimento" name="data_vencimento" value="{{ hoje.isoformat() }}">
    </div>
  </div>

  <div class="acoes">
    <button class="botao" type="submit">Salvar lançamento</button>
    <a class="botao neutro" href="{{ url_for('financeiro.pagamentos') }}">Cancelar</a>
  </div>
</form>
</div></section>
{% endblock %}
