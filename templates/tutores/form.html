{% extends "base.html" %}
{% block titulo %}{{ 'Editar tutor' if tutor else 'Novo tutor' }} — VetCare{% endblock %}

{% block conteudo %}
<div class="titulo-pagina">
  <div><h1>{{ 'Editar tutor' if tutor else 'Novo tutor' }}</h1></div>
</div>

<section class="bloco"><div class="bloco-corpo">
<form method="post">
  <div class="campo">
    <label for="nome">Nome completo</label>
    <input type="text" id="nome" name="nome" required value="{{ tutor.nome if tutor else '' }}">
  </div>
  <div class="linha">
    <div class="campo">
      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" required value="{{ tutor.cpf if tutor else '' }}">
    </div>
    <div class="campo">
      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" name="telefone" required value="{{ tutor.telefone if tutor else '' }}">
    </div>
  </div>
  <div class="campo">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" value="{{ tutor.email or '' if tutor else '' }}">
  </div>
  <div class="campo">
    <label for="endereco">Endereço</label>
    <input type="text" id="endereco" name="endereco" value="{{ tutor.endereco or '' if tutor else '' }}">
  </div>
  <div class="campo marcador">
    <input type="checkbox" id="ativo" name="ativo" {{ 'checked' if (tutor is none or tutor.ativo) }}>
    <label for="ativo" style="margin:0">Cadastro ativo</label>
  </div>
  <div class="acoes">
    <button class="botao" type="submit">Salvar tutor</button>
    <a class="botao neutro" href="{{ url_for('cadastros.tutores') }}">Cancelar</a>
  </div>
</form>
</div></section>
{% endblock %}
