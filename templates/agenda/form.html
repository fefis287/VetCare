{% extends "base.html" %}
{% block titulo %}{{ 'Editar consulta' if agendamento else 'Marcar consulta' }} — VetCare{% endblock %}

{% block conteudo %}
<div class="titulo-pagina">
  <div><h1>{{ 'Editar consulta' if agendamento else 'Marcar consulta' }}</h1></div>
</div>

<section class="bloco"><div class="bloco-corpo">
<form method="post">
  <div class="linha">
    <div class="campo">
      <label for="animal_id">Animal</label>
      <select id="animal_id" name="animal_id" required>
        <option value="">Selecione</option>
        {% for animal in animais %}
          <option value="{{ animal.id }}" {{ 'selected' if agendamento and agendamento.animal_id == animal.id }}>
            {{ animal.nome }} — {{ animal.tutor.nome }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="veterinario_id">Veterinário</label>
      <select id="veterinario_id" name="veterinario_id" required>
        <option value="">Selecione</option>
        {% for vet in veterinarios %}
          <option value="{{ vet.id }}" {{ 'selected' if agendamento and agendamento.veterinario_id == vet.id }}>
            {{ vet.nome }}{% if vet.especialidade %} — {{ vet.especialidade }}{% endif %}
          </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="linha">
    <div class="campo">
      <label for="data_hora">Data e hora</label>
      <input type="datetime-local" id="data_hora" name="data_hora" required
             value="{{ agendamento.data_hora.strftime('%Y-%m-%dT%H:%M') if agendamento else '' }}">
    </div>
    <div class="campo">
      <label for="status">Situação</label>
      <select id="status" name="status">
        {% for s in situacoes %}
          <option value="{{ s }}" {{ 'selected' if agendamento and agendamento.status == s }}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="campo">
    <label for="motivo">Motivo da consulta</label>
    <input type="text" id="motivo" name="motivo" required value="{{ agendamento.motivo if agendamento else '' }}">
  </div>

  <div class="campo">
    <label for="observacoes">Observações para o atendimento</label>
    <textarea id="observacoes" name="observacoes">{{ agendamento.observacoes or '' if agendamento else '' }}</textarea>
  </div>

  <div class="acoes">
    <button class="botao" type="submit">Salvar consulta</button>
    <a class="botao neutro" href="{{ url_for('agenda.lista') }}">Cancelar</a>
  </div>
</form>
</div></section>
{% endblock %}
