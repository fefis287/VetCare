{% extends "base.html" %}
{% block titulo %}Registrar vacina — VetCare{% endblock %}

{% block conteudo %}
<div class="titulo-pagina">
  <div><h1>Registrar aplicação</h1><p>A próxima dose é calculada pelo intervalo da vacina, se você deixar em branco.</p></div>
</div>

<section class="bloco"><div class="bloco-corpo">
<form method="post">
  <div class="linha">
    <div class="campo">
      <label for="animal_id">Animal</label>
      <select id="animal_id" name="animal_id" required>
        <option value="">Selecione</option>
        {% for animal in animais %}
          <option value="{{ animal.id }}" {{ 'selected' if animal_sugerido == animal.id }}>
            {{ animal.nome }} — {{ animal.tutor.nome }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="vacina_id">Vacina</label>
      <select id="vacina_id" name="vacina_id" required>
        <option value="">Selecione</option>
        {% for vacina in vacinas %}
          <option value="{{ vacina.id }}">{{ vacina.nome }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="linha">
    <div class="campo">
      <label for="data_aplicacao">Data da aplicação</label>
      <input type="date" id="data_aplicacao" name="data_aplicacao" value="{{ hoje.isoformat() }}">
    </div>
    <div class="campo">
      <label for="proxima_dose">Próxima dose</label>
      <input type="date" id="proxima_dose" name="proxima_dose">
    </div>
    <div class="campo">
      <label for="dose">Dose</label>
      <input type="number" id="dose" name="dose" min="1" value="1">
    </div>
    <div class="campo">
      <label for="lote">Lote</label>
      <input type="text" id="lote" name="lote">
    </div>
  </div>

  <div class="acoes">
    <button class="botao" type="submit">Registrar vacina</button>
    <a class="botao neutro" href="{{ url_for('clinico.vacinacao') }}">Cancelar</a>
  </div>
</form>
</div></section>
{% endblock %}
